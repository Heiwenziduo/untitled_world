<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cypher_nexus — devtools</title>
<style>
  :root{
    --bg:        #121018;
    --panel:     #1b1725;
    --panel-2:   #201c2c;
    --line:      #332c44;
    --text:      #ece7f5;
    --text-dim:  #9a90b3;
    --mana:      #5fc1ff;
    --amber:     #e8b04b;
    --danger:    #e08787;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, Inter, system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    display:grid; grid-template-columns:260px 260px 1fr; grid-template-rows:44px 1fr; height:100vh;
  }
  header{
    grid-column:1 / -1; display:flex; align-items:center; gap:8px; padding:0 14px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header .brand{ font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--text); }
  header .brand b{ color:var(--mana); }
  header .status{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  #palette, #deck{ overflow-y:auto; padding:12px; border-right:1px solid var(--line); background:var(--panel); }
  #canvasWrap{
    position:relative; overflow:auto;
    background-image: radial-gradient(circle, #241f33 1px, transparent 1px);
    background-size: 22px 22px;
  }

  h2{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--text-dim); margin:16px 0 6px; font-weight:600;
  }
  h2:first-child{ margin-top:2px; }

  .entry{
    display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
    cursor:pointer; font-size:13px; border:1px solid transparent;
  }
  .entry:hover{ background:var(--panel-2); }
  .entry:focus-visible, button:focus-visible{ outline:2px solid var(--mana); outline-offset:1px; }
  .dot{ width:9px; height:9px; border-radius:3px; flex:0 0 auto; }

  .deckItem{
    display:flex; align-items:center; gap:6px; padding:5px 8px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:6px; margin-bottom:5px; font-size:13px;
  }
  .deckItem .idx{ font-family:var(--mono); color:var(--text-dim); width:1.4em; flex:0 0 auto; }
  .deckItem .label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deckItem button{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; padding:2px 4px;
  }
  .deckItem button:hover{ color:var(--text); }
  .deckItem button.remove:hover{ color:var(--danger); }

  #compileBtn{
    width:100%; padding:9px; margin-top:12px; background:var(--mana); color:#0c1420;
    border:none; border-radius:6px; cursor:pointer; font-weight:700; font-family:var(--mono);
    font-size:12px; letter-spacing:.03em;
  }
  #compileBtn:hover{ filter:brightness(1.08); }
  #emptyDeck{ color:var(--text-dim); font-size:12px; padding:6px 4px; }

  #hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-family:var(--mono); font-size:12px; text-align:center; pointer-events:none;
  }

  svg text{ fill:var(--text); font-family:var(--sans); font-size:11px; }
  svg text.mono{ font-family:var(--mono); }
  .node rect{ fill:var(--panel-2); stroke:var(--line); stroke-width:1; rx:8px; }
  .node .catbar{ opacity:.9; }
  .edgeLabel{ fill:var(--text-dim); font-size:10px; }
  .edgeLine{ stroke:#4a415f; stroke-width:1.5; }
</style>
</head>
<body>
  <header>
    <div class="brand">cypher_<b>nexus</b> :: devtools</div>
    <div class="status" id="status">loading palette…</div>
  </header>

  <div id="palette"></div>

  <div id="deck">
    <h2>Deck</h2>
    <div id="deckList"><div id="emptyDeck">click cyphers on the left to add them</div></div>
    <button id="compileBtn">Compile AST</button>
  </div>

  <div id="canvasWrap">
    <div id="hint">build a deck, then hit "Compile AST"</div>
    <svg id="canvas"></svg>
  </div>

<script>
let palette = [];
let deck = [];

async function loadPalette() {
  const res = await fetch('/api/palette');
  palette = await res.json();
  document.getElementById('status').textContent = palette.length + ' cyphers registered';
  renderPalette();
}

function renderPalette() {
  const byCategory = {};
  for (const entry of palette) {
    if (entry.hidden) continue;
    (byCategory[entry.cypher.category] ??= []).push(entry.cypher);
  }
  const el = document.getElementById('palette');
  el.innerHTML = '';
  for (const [cat, list] of Object.entries(byCategory)) {
    const h = document.createElement('h2');
    h.textContent = cat;
    el.appendChild(h);
    for (const cy of list) {
      const row = document.createElement('div');
      row.className = 'entry';
      row.tabIndex = 0;
      row.innerHTML = `<span class="dot" style="background:${colorHex(cy.categoryColor)}"></span><span>${cy.label}</span>`;
      row.onclick = () => { deck.push(cy); renderDeck(); };
      row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') row.onclick(); };
      el.appendChild(row);
    }
  }
}

function colorHex(argb) {
  const c = (argb >>> 0) & 0xFFFFFF;
  return '#' + c.toString(16).padStart(6, '0');
}

function renderDeck() {
  const el = document.getElementById('deckList');
  el.innerHTML = '';
  if (deck.length === 0) {
    el.innerHTML = '<div id="emptyDeck">click cyphers on the left to add them</div>';
    return;
  }
  deck.forEach((cy, i) => {
    const row = document.createElement('div');
    row.className = 'deckItem';
    row.innerHTML = `<span class="idx">${i + 1}</span><span class="label">${cy.label}</span>`;

    const up = document.createElement('button');
    up.textContent = '↑'; up.title = 'move up';
    up.onclick = () => { if (i > 0) { [deck[i-1], deck[i]] = [deck[i], deck[i-1]]; renderDeck(); } };

    const down = document.createElement('button');
    down.textContent = '↓'; down.title = 'move down';
    down.onclick = () => { if (i < deck.length - 1) { [deck[i+1], deck[i]] = [deck[i], deck[i+1]]; renderDeck(); } };

    const rm = document.createElement('button');
    rm.className = 'remove'; rm.textContent = '✕'; rm.title = 'remove';
    rm.onclick = () => { deck.splice(i, 1); renderDeck(); };

    row.append(up, down, rm);
    el.appendChild(row);
  });
}

document.getElementById('compileBtn').onclick = async () => {
  const ids = deck.map(cy => cy.id);
  const res = await fetch('/api/ast', { method: 'POST', body: JSON.stringify(ids) });
  if (!res.ok) { alert('compile failed: ' + await res.text()); return; }
  const ast = await res.json();
  document.getElementById('hint').style.display = 'none';
  drawTree(ast);
};

// ---------------------------------------------------------------------------------------------
// tree layout: each node's width is the sum of its children's widths (min one leaf-slot wide)
// ---------------------------------------------------------------------------------------------
const LEVEL_H = 130, LEAF_W = 170, NODE_W = 150, NODE_H = 64;

function layout(node, depth) {
  if (!node || !node.projectiles || node.projectiles.length === 0) {
    return { node, depth, width: LEAF_W, children: [] };
  }
  const children = node.projectiles.map(edge => ({
    edge,
    sub: layout(edge.payload, depth + 1),
  }));
  const width = Math.max(LEAF_W, children.reduce((a, c) => a + c.sub.width, 0));
  return { node, depth, width, children };
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function draw(laid, x, svg) {
  const cx = x + laid.width / 2;
  const y = laid.depth * LEVEL_H + 30;
  drawNode(laid.node, cx, y, svg);

  let cursorX = x;
  for (const { edge, sub } of laid.children) {
    const childCx = cursorX + sub.width / 2;
    const childY = (laid.depth + 1) * LEVEL_H + 30;
    svg.appendChild(svgEl('line', { class: 'edgeLine', x1: cx, y1: y + NODE_H / 2, x2: childCx, y2: childY - NODE_H / 2 }));
    const midX = (cx + childCx) / 2, midY = (y + childY) / 2;
    const t = svgEl('text', { class: 'edgeLabel', x: midX, y: midY, 'text-anchor': 'middle' });
    t.textContent = `${edge.cypher.label} · ${edge.trigger}`;
    svg.appendChild(t);
    draw(sub, cursorX, svg);
    cursorX += sub.width;
  }
}

function drawNode(node, cx, y, svg) {
  const g = svgEl('g', { class: 'node' });
  g.appendChild(svgEl('rect', { x: cx - NODE_W / 2, y: y - NODE_H / 2, width: NODE_W, height: NODE_H }));

  const bar = svgEl('rect', {
    class: 'catbar', x: cx - NODE_W / 2, y: y - NODE_H / 2, width: 4, height: NODE_H,
    fill: node && node.contributors[0] ? colorHex(node.contributors[0].cypher.categoryColor) : '#4a415f',
  });
  g.appendChild(bar);

  const lines = node
    ? [`delay ${node.delay}  recharge ${node.recharge}`,
       ...node.contributors.map(c => `${c.cypher.label}${c.count > 1 ? ' ×' + c.count : ''}`)]
    : ['(chain ends)'];

  lines.slice(0, 4).forEach((text, i) => {
    const t = svgEl('text', {
      class: i === 0 ? 'mono edgeLabel' : '',
      x: cx - NODE_W / 2 + 12, y: y - NODE_H / 2 + 16 + i * 13,
    });
    t.textContent = text;
    g.appendChild(t);
  });
  svg.appendChild(g);
}

function drawTree(root) {
  const svg = document.getElementById('canvas');
  svg.innerHTML = '';
  const laid = layout(root, 0);
  const width = Math.max(laid.width, 400);
  const depthMax = maxDepth(laid);
  svg.setAttribute('width', width);
  svg.setAttribute('height', (depthMax + 1) * LEVEL_H + 40);
  draw(laid, 0, svg);
}

function maxDepth(laid) {
  if (laid.children.length === 0) return laid.depth;
  return Math.max(...laid.children.map(c => maxDepth(c.sub)));
}

loadPalette();
</script>
</body>
</html>
