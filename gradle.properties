# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# Gradle 8.0+ treats target mismatches as a critical risk,
# compiled kotlin 24 code runs flawlessly on a java 25, though.
kotlin.jvm.target.validation.mode=warning
# "The minimum supported Gradle version will become Gradle 8.14.4 in Kotlin 2.5.0." ignore the warning
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,)
neo_version=26.1.2.74
neo_version_range=[26.1.2.74,)

# Kotlin for Forge
loader_version_range=[6.2,)

mod_id=cypher_nexus
mod_name=Cypher Nexus
mod_license=MIT
mod_version=0.0.1
mod_group_id=com.github.nahnullscience.cypher_nexus
mod_authors=NahnullScience
